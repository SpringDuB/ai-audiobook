[project]
name = "aiab-tts"
version = "0.1.0"
description = "AI 有声书 TTS 推理服务（独立进程；IndexTTS-2.5 与 fake 两种后端）"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
aiab-tts = "aiab_tts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
