<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f4ef">
  <title>AI 有声书 · 编辑台</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    // 首访跟随系统，之后跟随用户选择。必须在样式表之前跑，避免刷新时闪一帧。
    (function () {
      try {
        var saved = localStorage.getItem("aiab-theme");
        var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header id="masthead" class="masthead">
    <div class="masthead__brand">
      <span class="masthead__mark" aria-hidden="true" translate="no">声</span>
      <span class="masthead__name" translate="no">AI 有声书</span>
      <span id="crumb" class="masthead__crumb">书架</span>
    </div>
    <div class="masthead__tail">
      <div class="masthead__status" id="runstatus" aria-live="polite">
        <span class="dot" data-state="idle" aria-hidden="true"></span>
        <span class="mono" id="runlabel">空闲</span>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换到深色主题" title="切换深色主题">☾</button>
    </div>
  </header>

  <nav id="rail" class="rail" aria-label="主导航">
    <a href="#/shelf" data-route="shelf">
      <span class="rail__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></svg></span>
      <span>书架</span>
    </a>
    <a href="#/jobs" data-route="jobs">
      <span class="rail__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" /><path d="M13 12h8" /><path d="M13 19h8" /><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /></svg></span>
      <span>任务</span>
    </a>
    <a href="#/issues" data-route="issues">
      <span class="rail__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg></span>
      <span>异常</span>
    </a>
    <a href="#/voices" data-route="voices">
      <span class="rail__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3" /><path d="M6 6v11" /><path d="M10 3v18" /><path d="M14 8v7" /><path d="M18 5v13" /><path d="M22 10v3" /></svg></span>
      <span>音色</span>
    </a>
    <a href="#/settings" data-route="settings">
      <span class="rail__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></span>
      <span>设置</span>
    </a>
  </nav>

  <main id="main" tabindex="-1" data-boot="loading"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
